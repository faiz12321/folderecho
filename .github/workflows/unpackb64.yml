name: unpackb64
on:
  workflow_dispatch:
  push:
    paths:
      - 'bundle.b64'
permissions:
  contents: write
  actions: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          base64 -d bundle.b64 > /tmp/b.zip
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name bundle.b64 -exec rm -rf {} +
          unzip -o /tmp/b.zip
          git rm -q --cached bundle.b64 || true
          rm -f bundle.b64
          git config user.name "FolderEcho CI"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -m "Add project files" || true
          git push
          gh workflow run ci.yml
        env:
          GH_TOKEN: ${{ github.token }}
