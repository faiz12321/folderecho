name: unpack
on:
  push:
    paths: ['bundle.zip', '*-bundle.zip']
permissions:
  contents: write
  actions: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace files from bundle zip
        run: |
          BUNDLE=$(ls | grep -E '(^|-)bundle\.zip$' | head -1)
          echo "bundle file: $BUNDLE"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name bundle.zip ! -name '*-bundle.zip' -exec rm -rf {} +
          unzip -q "$BUNDLE"
          rm -f "$BUNDLE"
          git config user.name "FolderEcho"
          git config user.email "noreply@users.noreply.github.com"
          git add -A
          git commit -m "Update project files"
          git push
          gh workflow run ci.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
